[project]
name = "inverse-spx"
version = "0.1.0"
description = "Backtest of an inverse-weighted S&P 500 index (smallest cap = largest weight) from 2015-2025"
requires-python = ">=3.10"
dependencies = [
  "yfinance>=0.2",
  "pandas>=2.1",
  "numpy>=1.26",
  "requests>=2.31",
  "pyarrow>=14",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
wrds = ["wrds>=3.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
